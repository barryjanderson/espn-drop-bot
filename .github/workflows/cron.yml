# Vercel Hobby cannot schedule sub-daily crons; this pings the serverless monitor every 5 minutes.
name: Poll ESPN drop monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel monitor
        env:
          MONITOR_URL: ${{ secrets.MONITOR_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_BYPASS_TOKEN: ${{ secrets.VERCEL_BYPASS_TOKEN }}
        run: |
          if [ -z "$MONITOR_URL" ] || [ -z "$CRON_SECRET" ] || [ -z "$VERCEL_BYPASS_TOKEN" ]; then
            echo "Set GitHub secrets MONITOR_URL, CRON_SECRET, and VERCEL_BYPASS_TOKEN (repo Settings → Secrets)."
            exit 1
          fi
          SEP='?'
          if [[ "$MONITOR_URL" == *\?* ]]; then SEP='&'; fi
          curl -sS --fail-with-body \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            "${MONITOR_URL}${SEP}x-vercel-protection-bypass=${VERCEL_BYPASS_TOKEN}"
