# Vercel Hobby cannot schedule sub-daily crons; this pings the serverless monitor every 5 minutes.
name: Poll ESPN drop monitor

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel monitor
        env:
          MONITOR_URL: ${{ secrets.MONITOR_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_BYPASS_TOKEN: ${{ secrets.VERCEL_BYPASS_TOKEN }}
        run: |
          if [ -z "$MONITOR_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set GitHub secrets MONITOR_URL and CRON_SECRET (repo Settings → Secrets and variables → Actions)."
            exit 1
          fi
          URL="$MONITOR_URL"
          if [ -n "$VERCEL_BYPASS_TOKEN" ]; then
            if [[ "$MONITOR_URL" == *\?* ]]; then
              URL="${MONITOR_URL}&x-vercel-protection-bypass=${VERCEL_BYPASS_TOKEN}"
            else
              URL="${MONITOR_URL}?x-vercel-protection-bypass=${VERCEL_BYPASS_TOKEN}"
            fi
          fi
          curl -sS --fail-with-body \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            "$URL"
